/* ---------- timer per soal dan monster yang mendekat (Kuis Kilat, Telinga Tajam, Jago Ejaan, Pasang Kartu) ---------- */
const Q_SEC = { santai: 20, petualang: 12, pendekar: 8 }, M_SEC = { santai: 180, petualang: 120, pendekar: 90 };

const qKind = () => QKIND[G && G.tag ? String(G.tag).split(':')[0] : ''] || QKIND.vil;
let QT = 0, QLAST = 0;
const qDone = () => G.m === 'quiz' ? !!(G.q && G.q.pick != null) : G.m === 'type' ? !!(G.t && G.t.done) : false;

  const anim = fxMode() !== 'off', shoot = anim && done && ok, atk = anim && done && !ok;

  return `<div class="qstrip"><div class="darena" style="--p:${prog.toFixed(3)}"><svg class="dhero ${atk ? 'hit' : ''}" viewBox="-30 -104 60 110" aria-hidden="true">${duelHeroSVG(shoot ? 3 : -1)}</svg><svg class="dmon ${shoot ? 'mhit' : ''} ${atk ? 'atk' : ''}" viewBox="-34 -58 68 64" aria-hidden="true"><g transform="scale(-1 1)">${monBody(qKind())}</g></svg>${shoot ? `<div class="dbullet" style="--c:${curWeapon().col}"></div><div class="dnum">-1</div>` : ''}</div>${bar}</div>`;
}
function qScene(ok) {   /* suara dan pose: tembakan, atau serangan monster; selesai sendiri */

  if (ok) {
    sfx.shoot(); setTimeout(() => { const v = document.querySelector('.qstrip .hsv'); if (v) v.setAttribute('viewBox', '0 0 340 368'); }, 180); setTimeout(() => sfx.hit(), 270);
    setTimeout(() => document.querySelectorAll('.qstrip .dbullet').forEach(x => x.remove()), 340);
    setTimeout(() => { const p = document.querySelector('.qstrip .dhero'); if (!p) return; const sh = p.querySelector('.hshoot'), id = p.querySelector('.hidle'), gn = p.querySelector('.dgun'); if (sh) sh.setAttribute('display', 'none'); if (id) id.setAttribute('display', 'inline'); if (gn) gn.setAttribute('display', 'none'); }, 640);

function qtStart() {   /* dipanggil setelah soal digambar: membuat pewaktu soal bila belum ada dan menjalankan detaknya */

  else return;

}
function qTick() {

/* ---------- actions ---------- */
let resetArmed = false;
const A = {

  gmenu() { PM.open({ note: 'XP dari jawaban yang sudah kamu kirim tetap tersimpan.', toMap: () => A.home(), toTitle: () => A.gtitle() }); },
  gtitle() { clearTimer(); G = null; view = 'home'; app.innerHTML = ''; TITLE.show(); },
  start(el) { start(el.dataset.m); },
  again() { start(G.m, G.cats, G.n0, G.tag); },
  say(el) { say(WORDS[+el.dataset.w][1]); },
  sound() { S.sound = !S.sound; save(); render(); if (S.sound) sfx.ok(); },
  reset(el) {
    if (!resetArmed) {
      resetArmed = true; el.textContent = 'Yakin? Ketuk sekali lagi';
      setTimeout(() => { resetArmed = false; if (view === 'home') render(); }, 3500);
    } else { resetArmed = false; S = defaults(); save(); toast('Progres direset'); render(); }

  /* flashcards */
  flip() {

  },
  known() { const i = G.ids[G.k]; record(i, true, 5); G.score++; G.xp += 5; sfx.ok(); G.k++; G.flipped = false; render(); },
  unknown() { const i = G.ids[G.k]; record(i, false, 0); missOnce(i); sfx.no(); G.k++; G.flipped = false; render(); },
  /* quiz + listen */
  peek() { const q = G.q; if (!q || q.pick != null || G.m !== 'listen') return; q.peek = true; render(); },
  pick(el) {
    const q = G.q; if (!q || q.pick != null) return;
    const j = +el.dataset.j, ok = j === q.i;
    q.pick = j;
    if (ok) { G.combo++; q.gain = (G.m === 'listen' ? 12 : 10) + Math.min(G.combo - 1, 5) * 2; if (q.peek) q.gain = Math.ceil(q.gain / 2); G.score++; G.xp += q.gain; sfx.ok(); }
    else { G.combo = 0; missOnce(q.i); sfx.no(); }
    record(q.i, ok, q.gain, !!q.peek);
    setTimeout(() => say(WORDS[q.i][1]), 250);
    render(); qScene(ok);
  },
  qtimeout() {   /* waktu habis: dihitung salah, monster menyerang */
    if (!G || G.res) return;
    track('waktu-habis', 'Waktu soal habis: ' + G.m);
    if (G.m === 'quiz') { const q = G.q; if (!q || q.pick != null) return; q.pick = -1; q.late = true; G.combo = 0; missOnce(q.i); sfx.no(); record(q.i, false, 0); setTimeout(() => say(WORDS[q.i][1]), 250); render(); qScene(false); }
    else if (G.m === 'type') { const tt = G.t; if (!tt || tt.done) return; tt.late = true; typeFinish(false); }
    else if (G.m === 'match') { G.timedOut = true; G.sec = (Date.now() - G.t0) / 1000 | 0; G.ids.forEach(i => { if (!G.done.has(i)) missOnce(i); }); clearTimer(); finish(); }
  },
  replayintro() { ADV.panel = null; renderOverlay(); rpgIntro(); },
  pwainstall() { PWA.prompt(); track('pasang-pilih-offline', 'Memilih pasang di HP (Opsi)'); PWA.run(); },
  pwaremove() { PWA.remove(); },
  helpplay() { ADV.panel = null; renderOverlay(); rpgHelp(); },
  setqt(el) { S.qtimer = el.dataset.v; save(); render(); },
  next() { G.k++; G.q = null; G.t = null; render(); },
  /* typing */
  hint() {
    const t = G.t, max = [...WORDS[G.ids[G.k]][1]].filter(ch => /[a-z0-9]/i.test(ch)).length;

  },
  check() {

    t.val = el.value;

    t.tries++;

  },

  if (u.phase === 'busy') return h + `<p class="note">⏳ Game sedang disimpan di HP ini...</p>` + pwaBar();

  if (PWA.stored()) return h + `<p class="note">✅ Tersimpan di HP ini (${((g.bytes || 0) / 1048576).toFixed(1)} MB). Game bisa dibuka tanpa internet. Versi baru, ikon, dan data lain diperbarui otomatis di latar belakang saat ada internet.</p><div class="actions" style="margin-top:0"><button class="btn sm ghost" data-a="pwaremove">Hapus unduhan</button></div>${ver}`;
  /* belum tersimpan (belum memilih, "Mainkan dulu" yang belum selesai, gagal, Penghemat Data, atau sudah dihapus): selalu sarankan memasang */
  const why = u.phase === 'fail' ? `<p class="note">Terakhir gagal: ${PWA.failText(u)}</p>` : PWA.saveData() ? '<p class="note">Penghemat Data aktif, jadi unduhan otomatis ditunda. Ketuk tombol di bawah untuk memasang sekarang.</p>' : (g.choice === 'online' || g.choice === 'offline') ? '<p class="note">Unduhan belum selesai. Ia dilanjutkan diam-diam saat ada internet, atau ketuk tombol di bawah.</p>' : '';
  return h + `<div class="pwa-rec"><p><b>⚠️ Game ini belum tersimpan di HP-mu.</b> Kami menyarankan memasangnya (sekitar ${PWA.mb()} MB, sekali saja):</p><ul><li>Bisa dimainkan <b>tanpa internet</b></li><li>Dibuka lebih cepat dan lebih lancar</li><li>Versi baru, ikon, dan data lain <b>diperbarui otomatis</b> di latar belakang</li></ul></div>${why}<div class="actions" style="margin-top:6px"><button class="btn sm" data-a="pwainstall">⬇️ Pasang di HP</button></div>${ver}`;
};
