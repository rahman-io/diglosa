const KEY = 'hoot-ielts-a1-v1';
const defaults = () => ({ type: 'academic', exam: true, mic: false, theme: 'auto', skin: 'petualangan', best: {}, hist: [] });
let S = (() => { try { const r = localStorage.getItem(KEY); if (r) return Object.assign(defaults(), JSON.parse(r)); } catch (e) {} return defaults(); })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

const sections = m => m === 'L' ? LIS : m === 'R' ? RD[S.type] : [];
const qflat = m => { let n = 0; const out = []; sections(m).forEach((s, si) => s.qs.forEach(q => out.push({ n: ++n, si, q }))); return out; };
const ansd = (m, n) => { const v = R.ans[m][n]; return v !== undefined && v !== null && v !== ''; };
const isRight = (q, v) => {
  if (v === undefined || v === null || v === '') return false;
  if (q.t === 'mcq') return v === q.a;
  if (q.t === 'tfng') return v === q.a;
  return q.a.some(x => nk(x) === nk(v));
};
const corr = q => q.t === 'mcq' ? q.o[q.a] : q.t === 'tfng' ? q.a : q.a[0];
const given = (q, v) => (v === undefined || v === null || v === '') ? '(kosong)' : q.t === 'mcq' ? q.o[v] : v;

/* ================= AUDIO / SPEECH ================= */
const hasTTS = 'speechSynthesis' in window;
let enVoices = [], keep = [];
const loadVoices = () => { if (hasTTS) enVoices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); };
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function voices() {
  const us = enVoices.filter(v => /en[-_]US/i.test(v.lang)), gb = enVoices.filter(v => /en[-_]GB/i.test(v.lang));
  const a = us[0] || enVoices[0] || null;
  return [a, us[1] || gb[0] || enVoices.find(v => v !== a) || a];
}
function speak(text, who, onend) {
  if (!hasTTS) return;
  const [a, b] = voices(), u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = .82;
  const v = who === 'B' ? b : a; if (v) u.voice = v;
  if (a === b) u.pitch = who === 'B' ? .75 : 1.15;
  if (onend) u.onend = onend;
  keep.push(u); if (keep.length > 40) keep.shift();
  speechSynthesis.speak(u);
}
const stopSpeech = () => { try { if (hasTTS) speechSynthesis.cancel(); } catch (e) {} };
function startRec() {
  if (!SR || !S.mic) return;
  try {
    rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
    rec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript + ' '; R.sp.tr[R.sp.i] = t.trim(); const el = $('#tr'); if (el) el.textContent = t.trim() || '...'; };
    rec.onerror = () => { const el = $('#tr'); if (el && !R.sp.tr[R.sp.i]) el.textContent = 'Mikrofon tidak tersedia di sini. Tetap bicara dengan suara keras, ya.'; };
    rec.start();
  } catch (e) {}
}
function stopRec() { try { if (rec) { rec.onend = null; rec.stop(); } } catch (e) {} rec = null; }
let tt;
function toast(m) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ================= NAVIGATION ================= */
function go(v) { view = v; render(); window.scrollTo(0, 0); }
function render() {
  ({ home: vHomeA, info: vInfo, brief: vBrief, test: vTest, modres: vModRes, final: vFinal })[view]();
  const w = app.firstElementChild; if (w && view !== 'home') w.classList.add('g');
}
function reset() { if (R) { clearInterval(R.timer); } stopSpeech(); stopRec(); R = null; }

function newRun(mods) {
  reset();
  R = { mods, i: 0, cur: mods[0], ans: { L: {}, R: {}, W: { 1: '', 2: '' }, S: {} }, res: {}, played: [], playing: null,
        self: { W: {}, S: {} }, sp: { i: 0, phase: 'ask', left: 0, max: 0, answered: {}, tr: {}, asked: {} }, timer: null, deadline: 0 };
  go('brief');
}
function beginModule() {
  const m = R.cur;
  if (S.exam && m !== 'S') { R.deadline = Date.now() + MODS[m].min * 60000; R.timer = setInterval(tick, 500); }
  go('test');
}
function tick() {
  const el = $('#timer'); if (!R || !R.deadline) return;
  const r = Math.max(0, Math.round((R.deadline - Date.now()) / 1000));
  if (el) { el.textContent = '⏱ ' + fmt(r); el.classList.toggle('warn', r <= 120); }
  if (r <= 0) { toast('Waktu habis. Jawabanmu dikumpulkan otomatis.'); finishModule(); }
}
function grade(m) {
  const items = qflat(m); let c = 0;
  items.forEach(it => { if (isRight(it.q, R.ans[m][it.n])) c++; });
  return { c, total: items.length, pct: Math.round(c / items.length * 100) };
}
function finishModule() {
  clearInterval(R.timer); R.deadline = 0; stopSpeech(); stopRec(); R.playing = null; R.armed = false;
  const m = R.cur;
  if (m === 'L' || m === 'R') { R.res[m] = grade(m); setBest(m, R.res[m].pct); }
  go('modres');
}
function nextModule() {
  R.i++;
  if (R.i < R.mods.length) { R.cur = R.mods[R.i]; go('brief'); } else finalize();
}
function finalize() {
  const keys = R.mods.filter(m => R.res[m]);
  if (R.mods.length === 4 && !R.saved) {
    const avg = Math.round(keys.reduce((a, m) => a + R.res[m].pct, 0) / keys.length);
    S.hist.unshift({ d: dstr(), type: S.type, avg, L: R.res.L.pct, R: R.res.R.pct, W: R.res.W.pct, S: R.res.S.pct });
    S.hist = S.hist.slice(0, 6); save(); R.saved = true;
  }
  go('final');
}
const verdict = p => p >= 70 ? ['Lulus level A1', '🎉'] : p >= 50 ? ['Hampir lulus', '💪'] : ['Perlu latihan lagi', '📚'];

    <section class="card"><h2>Format tes: kertas atau komputer</h2>

      <ul><li>Listening dan Reading dinilai otomatis. Ejaan jawaban harus benar.</li>

/* ================= BRIEF ================= */
const BRIEF = {
  L: m => ['Ada 4 section dan 20 soal: isian singkat dan pilihan ganda.',
    S.exam ? 'Audio diputar satu kali per section, seperti ujian asli. Jawab sambil mendengar.' : 'Mode latihan: audio boleh diputar ulang.',
    hasTTS ? 'Audio memakai suara perangkatmu. Naikkan volume dan pakai headphone bila bisa.' : 'Perangkat ini tidak mendukung suara, jadi teks audio akan ditampilkan sebagai gantinya.',
    'Tulis jawaban dengan huruf Inggris. Ejaan harus benar.'],
  R: m => ['Ada 3 section dan 15 soal.', 'TRUE: sama dengan teks. FALSE: bertentangan dengan teks. NOT GIVEN: tidak disebut di teks.',
    'Untuk soal isian, ambil kata dari teks. Ejaan harus benar.', `Jenis tes: ${S.type === 'academic' ? 'Academic (teks akademik sederhana)' : 'General Training (pengumuman, iklan, email)'}.`],
  W: m => ['Ada 2 tugas. Task 1 sebaiknya dikerjakan sekitar 10 menit (minimal 30 kata). Task 2 sekitar 20 menit (minimal 50 kata).',
    'Tes asli: 20 menit (150 kata) dan 40 menit (250 kata).', 'Setelah selesai, kamu melihat contoh jawaban dan menilai tulisanmu sendiri.',
    `Jenis tes: ${S.type === 'academic' ? 'Academic (Task 1 menjelaskan grafik)' : 'General Training (Task 1 menulis email)'}.`],
  S: m => ['Ada 3 bagian: wawancara, kartu topik, dan diskusi. Examiner (suara perangkat) mengajukan pertanyaan.',
    'Bicaralah dengan suara keras dalam bahasa Inggris selama pewaktu berjalan, dengan kalimat lengkap.',
    S.mic ? 'Transkrip suara aktif bila browser mendukung.' : 'Transkrip suara mati. Kamu bisa menyalakannya di beranda.',
    'Di akhir, kamu membandingkan dengan contoh jawaban dan menilai diri sendiri.']
};
function vBrief() {
  const m = R.cur, M = MODS[m];
  app.innerHTML = `<div class="wrap"><div class="top"><button class="icon-btn" data-a="exit">✕ Keluar</button><span class="pill">Bagian ${R.i + 1} dari ${R.mods.length}</span><button class="icon-btn" data-a="gmenu" aria-label="Menu">☰</button></div>
    <section class="card"><span class="chip" style="background:${M.c}">${M.e} ${M.name}</span>
      <h2 style="margin:10px 0">Petunjuk ${M.name}</h2>
      <div class="info"><ul>${BRIEF[m]().map(t => `<li>${t}</li>`).join('')}</ul></div>
      <p class="sub" style="margin-top:10px">${S.exam && m !== 'S' ? `Waktu simulasi: ${M.min} menit. Waktu tes asli: ${M.real}.` : `Waktu tes asli: ${M.real}.`}</p>
      <div class="actions"><button class="btn mint" data-a="begin">Mulai ${M.name}</button></div></section></div>`;
}

/* ================= TEST ================= */
const pal = m => `<div class="pal">${qflat(m).map(it => `<button class="pn ${ansd(m, it.n) ? 'on' : ''}" data-a="goq" data-n="${it.n}" aria-label="Soal ${it.n}">${it.n}</button>`).join('')}</div>`;
const tbar = (title, m, withPal) => `<div class="tbar"><div class="trow"><button class="icon-btn" data-a="exit" aria-label="Keluar">✕</button><div class="gtt">${title}</div>
  <span class="pill" id="timer">${S.exam && m !== 'S' ? '⏱ ' + fmt(Math.max(0, Math.round((R.deadline - Date.now()) / 1000))) : 'Tanpa timer'}</span><button class="icon-btn" data-a="gmenu" aria-label="Menu">☰</button></div>${withPal ? pal(m) : ''}</div>`;
function qHTML(m, it) {
  const { n, q } = it, v = R.ans[m][n]; let body;
  if (q.t === 'mcq') body = `<div class="choices">${q.o.map((o, i) => `<button class="choice ${v === i ? 'on' : ''}" data-a="ans" data-n="${n}" data-v="${i}"><kbd>${'ABC'[i]}</kbd>${esc(o)}</button>`).join('')}</div>`;
  else if (q.t === 'tfng') body = `<div class="choices tf">${['TRUE', 'FALSE', 'NOT GIVEN'].map(o => `<button class="choice ${v === o ? 'on' : ''}" data-a="ans" data-n="${n}" data-v="${o}">${o}</button>`).join('')}</div>`;
  if (q.t === 'fill') {
    const [pre, post] = q.q.split('___');
    return `<div class="q" id="q-${n}"><span class="qn">${n}</span>${esc(pre)}<input class="fill" data-n="${n}" value="${esc(v || '')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Jawaban soal ${n}">${esc(post)}</div>`;
  }
  return `<div class="q" id="q-${n}"><span class="qn">${n}</span>${esc(q.q)}${body}</div>`;
}
function vTest() { ({ L: tL, R: tR, W: tW, S: tS })[R.cur](); }

function tL() {
  const items = qflat('L');
  const secs = LIS.map((s, si) => `<section class="card"><div class="sh"><span class="chip">Section ${si + 1}</span><b>${s.k}</b></div>
    <div class="player"><button class="btn sky" data-a="play" data-i="${si}" id="pl${si}" ${hasTTS ? '' : 'disabled'}>▶ Putar audio</button><span class="sub" id="ps${si}">${hasTTS ? (S.exam ? 'Audio diputar satu kali.' : 'Audio boleh diulang.') : 'Suara tidak didukung di perangkat ini.'}</span></div>
    ${hasTTS ? '' : `<div class="scriptbox"><b>Teks audio:</b><br>${s.script.map(l => esc(l[1])).join(' ')}</div>`}
    ${items.filter(it => it.si === si).map(it => qHTML('L', it)).join('')}</section>`).join('');
  app.innerHTML = `<div class="wrap">${tbar('Listening', 'L', true)}${secs}<div class="actions c"><button class="btn mint" data-a="submit">Kumpulkan jawaban</button></div></div>`;
  LIS.forEach((s, si) => { if (R.played[si]) setPS(si, R.playing === si ? 'playing' : 'done'); });
}
function setPS(i, st) {
  const b = $('#pl' + i), p = $('#ps' + i); if (!b) return;
  if (st === 'playing') { b.disabled = true; b.textContent = '🔊 Sedang diputar...'; p.textContent = 'Dengarkan dan jawab sambil mendengar.'; }
  else if (S.exam) { b.disabled = true; b.textContent = '✔ Audio selesai'; p.textContent = 'Dalam ujian asli, audio hanya diputar satu kali.'; }
  else { b.disabled = false; b.textContent = '▶ Putar lagi'; p.textContent = 'Mode latihan: audio boleh diulang.'; }
}
function play(i) {
  if (!hasTTS || R.playing !== null || (S.exam && R.played[i])) return;
  R.played[i] = true; R.playing = i; stopSpeech(); setPS(i, 'playing');
  const sc = LIS[i].script;
  sc.forEach(([who, text], k) => speak(text, who, k === sc.length - 1 ? () => { if (R) { R.playing = null; setPS(i, 'done'); } } : null));
}

function tR() {
  const items = qflat('R');
  const secs = RD[S.type].map((s, si) => {
    const passage = s.text.map(t => t.startsWith('#') ? `<h4>${esc(t.slice(1))}</h4>` : `<p>${esc(t)}</p>`).join('');
    return `<section class="card"><div class="sh"><span class="chip">Section ${si + 1}</span><b>${s.k}</b></div>
      <div class="rd"><div class="passage">${passage}</div><div>${items.filter(it => it.si === si).map(it => qHTML('R', it)).join('')}</div></div></section>`;
  }).join('');
  app.innerHTML = `<div class="wrap">${tbar('Reading', 'R', true)}${secs}<div class="actions c"><button class="btn mint" data-a="submit">Kumpulkan jawaban</button></div></div>`;
}

function tW() {
  const w = WR[S.type];
  const chart = w.t1.chart ? `<div class="chart">${w.t1.chart.map(([k, v]) => `<div class="br"><span>${k}</span><div class="bar" style="width:${v / 8 * 100}%"></div><b>${v}</b></div>`).join('')}<small>Number of students (total: 20)</small></div>` : '';
  const task = (i, t) => `<section class="card"><span class="chip">Task ${i} (saran waktu ${t.mins} menit)</span>
    <p style="margin-top:10px">${esc(t.p)}</p>${i === 1 ? chart : ''}
    <textarea class="ta" data-w="${i}" placeholder="Write your answer here..." spellcheck="false">${esc(R.ans.W[i])}</textarea>
    <div class="wcount" id="wc${i}"></div></section>`;
  app.innerHTML = `<div class="wrap">${tbar('Writing', 'W', false)}${task(1, w.t1)}${task(2, w.t2)}<div class="actions c"><button class="btn mint" data-a="submit">Kumpulkan tulisan</button></div></div>`;
  updWC(1); updWC(2);
}
function updWC(i) {
  const el = $('#wc' + i); if (!el) return;
  const n = wc(R.ans.W[i]), min = WR[S.type]['t' + i].min;
  el.textContent = `${n} kata (minimal ${min})`; el.classList.toggle('ok', n >= min);
}

/* speaking */
function tS() {
  const sp = R.sp, st = SPK[sp.i], n = SPK.length;
  const cue = st.cue ? `<div class="cue"><b>${esc(st.cue.h)}</b><ul>${st.cue.l.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
  let body = '';
  if (sp.phase === 'ask') {
    body = `<div class="bubble">🧑‍🏫 ${esc(st.q)}</div>${cue}
      <div class="actions"><button class="btn sky" data-a="spask">🔊 Dengar pertanyaan lagi</button>
      <button class="btn mint" data-a="spgo">${st.prep ? `Mulai persiapan (${st.prep} detik)` : `🎤 Mulai bicara (${st.sec} detik)`}</button>
      <button class="btn ghost" data-a="spskip">Lewati</button></div>`;
  } else if (sp.phase === 'prep') {
    body = `<div class="bubble">Siapkan poin-poinmu.</div>${cue}<div class="timebar"><i id="spb" style="width:${sp.left / sp.max * 100}%"></i></div>
      <div class="actions"><span class="pill">Persiapan: <span id="spt">${sp.left}</span> detik</span><button class="btn mint" data-a="spskipprep">Mulai bicara sekarang</button></div>`;
  } else if (sp.phase === 'speak') {
    body = `<div class="bubble">🧑‍🏫 ${esc(st.q)}</div>${cue}<div class="timebar"><i id="spb" style="width:${sp.left / sp.max * 100}%"></i></div>
      <div class="actions"><span class="pill">🎤 Bicara: <span id="spt">${sp.left}</span> detik</span><button class="btn coral" data-a="spdone">Selesai</button></div>
      ${S.mic ? `<div class="tr" id="tr">${esc(sp.tr[sp.i] || (SR ? 'Mendengarkan...' : 'Browser ini belum mendukung transkrip suara.'))}</div>` : ''}`;
  } else {
    body = `<div class="bubble">Jawabanmu tersimpan.</div>${S.mic && sp.tr[sp.i] ? `<div class="tr">${esc(sp.tr[sp.i])}</div>` : ''}
      <div class="actions"><button class="btn mint" data-a="spnext">${sp.i + 1 >= n ? 'Selesai, lihat contoh jawaban' : 'Pertanyaan berikutnya'}</button></div>`;
  }
  app.innerHTML = `<div class="wrap">${tbar('Speaking', 'S', false)}<section class="card"><span class="chip">${st.title}</span>
    <p class="sub" style="margin-top:8px">Pertanyaan ${sp.i + 1} dari ${n}</p>${body}</section></div>`;
  if (sp.phase === 'ask' && !sp.asked[sp.i]) { sp.asked[sp.i] = true; setTimeout(() => { if (R && R.cur === 'S') speak(st.q, 'B'); }, 300); }
}
function spStart(phase, secs) {
  const sp = R.sp; clearInterval(R.timer); sp.phase = phase; sp.left = secs; sp.max = secs; stopSpeech();
  tS(); if (phase === 'speak') { sp.answered[sp.i] = true; startRec(); }
  R.timer = setInterval(() => {
    sp.left--; const t = $('#spt'), b = $('#spb');
    if (t) t.textContent = Math.max(0, sp.left); if (b) b.style.width = Math.max(0, sp.left / sp.max * 100) + '%';
    if (sp.left <= 0) { clearInterval(R.timer); spEnd(phase); }
  }, 1000);
}
function spEnd(phase) {
  const sp = R.sp, st = SPK[sp.i];
  if (phase === 'prep') spStart('speak', st.sec); else { stopRec(); sp.phase = 'done'; tS(); }
}

/* ================= MODULE RESULT ================= */
function selfHTML(m) {
  return `<div class="crit">${CRIT[m].map(([k, t, d]) => `<div><div class="t">${t}</div><div class="sub" style="font-size:.9rem">${d}</div>
    <div class="seg" style="margin-top:6px">${[['Belum', 0], ['Sebagian', 1], ['Ya', 2]].map(([l, v]) => `<button class="${R.self[m][k] === v ? 'on' : ''}" data-a="self" data-g="${m}" data-c="${k}" data-v="${v}">${l}</button>`).join('')}</div></div>`).join('')}</div>`;
}
function vModRes() {
  const m = R.cur, M = MODS[m];
  let html = '';
  if (m === 'L' || m === 'R') {
    const r = R.res[m], [vt, em] = verdict(r.pct);
    const rows = qflat(m).map(it => { const v = R.ans[m][it.n], ok = isRight(it.q, v);
      return `<div class="rv ${ok ? 'ok' : 'no'}"><span>${ok ? '✅' : '❌'}</span><div><b>Soal ${it.n}:</b> ${esc(it.q.q.replace('___', '____'))}<small>Jawabanmu: ${esc(given(it.q, v))}${ok ? '' : ` | Jawaban benar: ${esc(corr(it.q))}`}</small>${it.q.e ? `<small>${esc(it.q.e)}</small>` : ''}</div></div>`; }).join('');
    const scripts = m === 'L' ? LIS.map((s, si) => `<details><summary>Teks audio Section ${si + 1}</summary><div class="scriptbox">${s.script.map(l => esc(l[1])).join('<br>')}</div></details>`).join('') : '';
    html = `<section class="card" style="text-align:center"><span class="chip" style="background:${M.c}">${M.e} ${M.name}</span><div class="score">${r.c}/${r.total}</div><h2>${em} ${vt} (${r.pct}%)</h2></section>
      <section class="card"><h3>Pembahasan</h3>${rows}${scripts}</section>
      <div class="actions c"><button class="btn mint" data-a="nextmod">${R.i + 1 < R.mods.length ? 'Lanjut ke bagian berikutnya' : 'Lihat hasil akhir'}</button></div>`;
  } else if (m === 'W') {
    const w = WR[S.type], link = /\b(and|but|because|so|then|also|first|second|however|finally)\b/gi;
    const card = (i, t) => { const txt = R.ans.W[i] || '', n = wc(txt), sent = (txt.match(/[^.!?]+[.!?]+/g) || []).length, lk = new Set((txt.match(link) || []).map(x => x.toLowerCase())).size;
      return `<section class="card"><span class="chip">Task ${i}</span>
        <div class="met"><span class="pill">${n} kata ${n >= t.min ? '✅' : '❌ (min. ' + t.min + ')'}</span><span class="pill">${sent} kalimat</span><span class="pill">${lk} kata penghubung</span></div>
        <p class="sub">Tulisanmu:</p><div class="tr" style="white-space:pre-wrap;color:inherit">${esc(txt) || '(kosong)'}</div>
        <details><summary>Lihat contoh jawaban</summary><div class="scriptbox">${esc(t.sample)}</div></details></section>`; };
    const copy = `Please give feedback on my IELTS Writing practice (A1 level). Use the 4 IELTS criteria: Task Response, Coherence and Cohesion, Lexical Resource, Grammar. Explain simply in Indonesian and correct my mistakes.\n\nTask 1: ${w.t1.p}\nMy answer: ${R.ans.W[1] || '(empty)'}\n\nTask 2: ${w.t2.p}\nMy answer: ${R.ans.W[2] || '(empty)'}`;
    html = `${card(1, w.t1)}${card(2, w.t2)}
      <section class="card"><h3>Nilai tulisanmu sendiri</h3><p class="sub">Bandingkan dengan contoh jawaban, lalu pilih yang paling sesuai.</p>${selfHTML('W')}
        <details><summary>Minta Claude mengoreksi tulisanmu</summary><p class="note">Salin teks ini lalu tempel ke obrolan Claude.</p><textarea class="copybox" id="cp" readonly>${esc(copy)}</textarea>
        <div class="actions"><button class="btn sm sky" data-a="copy">Salin teks</button></div></details></section>
      <div class="actions c"><button class="btn mint" data-a="savew">Simpan skor dan lanjut</button></div>`;
  } else {
    const rows = SPK.map((st, i) => `<div class="rv ${R.sp.answered[i] ? 'ok' : 'no'}"><span>${R.sp.answered[i] ? '✅' : '⏭️'}</span><div><b>${esc(st.q)}</b>
      ${R.sp.tr[i] ? `<small>Transkrip: ${esc(R.sp.tr[i])}</small>` : ''}<small>Contoh jawaban: ${esc(st.s)}</small></div></div>`).join('');
    html = `<section class="card"><h3>Pertanyaan dan contoh jawaban</h3>${rows}</section>
      <section class="card"><h3>Nilai ucapanmu sendiri</h3><p class="sub">Jujur saja, ini hanya untuk melihat kemajuanmu.</p>${selfHTML('S')}</section>
      <div class="actions c"><button class="btn mint" data-a="saves">Simpan skor dan lanjut</button></div>`;
  }
  app.innerHTML = `<div class="wrap"><div class="top"><span class="brand" style="font-size:1.3rem">Hasil ${M.name}</span></div>${html}</div>`;
}

/* ================= FINAL ================= */
function vFinal() {
  const keys = R.mods.filter(m => R.res[m]);
  const avg = Math.round(keys.reduce((a, m) => a + R.res[m].pct, 0) / keys.length), [vt, em] = verdict(avg);
  const low = keys.slice().sort((a, b) => R.res[a].pct - R.res[b].pct)[0];
  const cards = keys.map(m => `<div class="rc" style="--c:${MODS[m].c}"><div style="font-size:1.8rem">${MODS[m].e}</div><b>${MODS[m].name}</b><div class="score">${R.res[m].pct}%</div><small>${verdict(R.res[m].pct)[0]}</small></div>`).join('');
  const nextLine = avg >= 70 ? 'Kamu siap naik ke A2. Lanjutkan dengan kosakata dan latihan yang lebih menantang.' : 'Ulangi simulasi setelah berlatih. Fokus pada bagian yang paling rendah.';
  app.innerHTML = `<div class="wrap"><div class="top"><span class="brand">Hasil akhir</span><span class="pill">${S.type === 'academic' ? 'Academic' : 'General Training'}</span></div>
    <section class="card" style="text-align:center"><div style="font-size:3.5rem">${em}</div><div class="score">${avg}%</div><h2>${vt}</h2><p class="sub">${nextLine}</p></section>
    <h2 class="sec">Skor per bagian</h2><div class="res4">${cards}</div>
    <section class="card" style="margin-top:18px"><h3>Saran untuk bagian ${MODS[low].name}</h3><p>${TIPS[low]}</p>

const A = {
  home() { reset(); go('home'); },
  gmenu() { HOST.pauseMenu({ note: R ? 'Ujian yang sedang berjalan akan dihentikan dan tidak dinilai.' : '', mapLabel: 'Kembali ke Istana', toMap: () => A.home(), toTitle: () => A.gtitle() }); },
  gtitle() { reset(); go('home'); HOST.showTitle(); },
  info() { go('info'); },
  exit() {
    if (!exitArmed) { exitArmed = true; toast('Ketuk sekali lagi untuk keluar. Progres bagian ini akan hilang.'); setTimeout(() => exitArmed = false, 3000); }
    else { exitArmed = false; A.home(); }
  },
  type(el) { S.type = el.dataset.v; save(); render(); },
  exam(el) { S.exam = el.dataset.v === '1'; save(); render(); },
  mic(el) { S.mic = el.dataset.v === '1'; save(); render(); },
  full() { newRun(['L', 'R', 'W', 'S']); },
  single(el) { newRun([el.dataset.m]); },
  begin() { beginModule(); },
  play(el) { play(+el.dataset.i); },
  goq(el) { const t = $('#q-' + el.dataset.n); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  ans(el) {
    const v = el.dataset.v, m = R.cur; R.ans[m][+el.dataset.n] = /^\d+$/.test(v) ? +v : v;
    el.parentElement.querySelectorAll('.choice').forEach(b => b.classList.toggle('on', b === el)); updPal();
  },
  submit(el) {
    const m = R.cur;
    if (m === 'W' || R.armed) { finishModule(); return; }
    const missing = qflat(m).filter(it => !ansd(m, it.n)).length;
    if (missing > 0) { R.armed = true; el.textContent = `Masih ${missing} soal kosong. Ketuk lagi untuk kumpulkan`; setTimeout(() => { R.armed = false; if (el.isConnected) el.textContent = 'Kumpulkan jawaban'; }, 4000); }
    else finishModule();
  },
  self(el) {
    const g = el.dataset.g; R.self[g][el.dataset.c] = +el.dataset.v;
    el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
  },
  copy() {
    const t = $('#cp'); t.focus(); t.select();
    try { navigator.clipboard.writeText(t.value).then(() => toast('Teks disalin'), () => { document.execCommand('copy'); toast('Teks disalin'); }); }
    catch (e) { try { document.execCommand('copy'); toast('Teks disalin'); } catch (e2) { toast('Pilih teks lalu salin manual'); } }
  },
  savew() {
    const w = WR[S.type], pts = (wc(R.ans.W[1]) >= w.t1.min ? 2 : 0) + (wc(R.ans.W[2]) >= w.t2.min ? 2 : 0);
    const self = Object.values(R.self.W).reduce((a, b) => a + b, 0);
    R.res.W = { pct: Math.round((pts + self) / 12 * 100) }; setBest('W', R.res.W.pct); nextModule();
  },
  saves() {
    const done = Object.keys(R.sp.answered).length, self = Object.values(R.self.S).reduce((a, b) => a + b, 0);
    R.res.S = { pct: Math.round((done / SPK.length * 8 + self) / 16 * 100) }; setBest('S', R.res.S.pct); nextModule();
  },
  nextmod() { nextModule(); },
  /* speaking */
  spask() { speak(SPK[R.sp.i].q, 'B'); },
  spgo() { const st = SPK[R.sp.i]; st.prep ? spStart('prep', st.prep) : spStart('speak', st.sec); },
  spskipprep() { clearInterval(R.timer); spStart('speak', SPK[R.sp.i].sec); },
  spdone() { clearInterval(R.timer); stopRec(); R.sp.phase = 'done'; tS(); },
  spnext() { stopSpeech(); const sp = R.sp; if (sp.i + 1 >= SPK.length) { finishModule(); return; } sp.i++; sp.phase = 'ask'; tS(); },
  spskip() { A.spnext(); }
};

function toNpc(i) {

function frame(ts) {

  const raw = (ts - ADV.last) / 1000 || 0, dt = Math.min(.1, raw); ADV.last = ts;
  const busy = advBusy(); let dx = 0, dy = 0, mag = 1;
  if (!busy) {

  }

  EX.forEach((a, i) => { const d = Math.hypot(ADV.px - a.npc.x, ADV.py - a.npc.y); if (d < bd) { bd = d; near = i; } });
  const ab = $('#act');

    if (near >= 0 && near !== ADV.near) { const door = EX[near].id === 'portal'; ab.querySelector('.actic').textContent = door ? '🔮' : '💬'; ab.querySelector('.actlb').textContent = door ? 'Masuk' : 'Bicara'; ab.querySelector('.actnm').textContent = EX[near].npc.n; }
  }
